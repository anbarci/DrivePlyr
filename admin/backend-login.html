<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>DrivePlyr Admin (Backend Entegre)</title>
  <meta name="description" content="Google Drive video yönetim paneli - Backend entegre ve tam mobil uyumlu.">
  <link rel="icon" href="../drive-logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-b from-purple-100 to-purple-300 min-h-screen flex flex-col">
  <main class="flex-1 flex justify-center items-center p-2">
    <section class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 flex flex-col items-center">
      <img src="../drive-logo.png" alt="DrivePlyr Logo" class="h-16 w-16 mb-6 rounded-full">
      <h1 class="text-2xl font-bold text-gray-700 mb-2">Admin Panel Backend Login</h1>
      <form class="w-full flex flex-col gap-4" id="loginForm">
        <div>
          <label for="email" class="block text-sm text-gray-600 mb-1">Email</label>
          <input type="email" id="email" name="email" required placeholder="E-posta adresi"
            class="w-full border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" />
        </div>
        <div>
          <label for="password" class="block text-sm text-gray-600 mb-1">Şifre</label>
          <input type="password" id="password" name="password" required placeholder="Şifre"
            class="w-full border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" />
        </div>
        <button type="submit"
          class="w-full bg-purple-600 text-white font-semibold py-2 rounded-lg hover:bg-purple-800 transition flex items-center justify-center gap-2"><i class="fas fa-sign-in-alt"></i> Giriş Yap</button>
      </form>
      <div id="errorMessage" class="mt-4 text-center text-red-600 hidden"></div>
      <div id="successMessage" class="mt-4 text-center text-green-600 hidden">Başarıyla giriş yapıldı! Yönlendiriliyorsunuz...</div>
    </section>
  </main>
  <footer class="text-center mt-auto py-4 text-xs text-gray-500">
    <span>© 2025 DrivePlyr Backend Entegrasyon Demo</span>
  </footer>
  <script src="js/backend-login.js"></script>
</body>
</html>
